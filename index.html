            transition: opacity 0.35s ease, transform 0.45s ease;

            opacity: 0;
            transform: scale(1.06);
        }

        #hotspots {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }

        .hotspot {
            position: absolute;
            width: 60px;
            height: 60px;
            transform: translate(-50%, -50%) rotate(var(--rotation, 0deg));
            border: none;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.75);
            color: black;
            font-size: 30px;
            font-weight: bold;
            cursor: pointer;
            pointer-events: auto;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, background 0.2s ease;
        }

        .hotspot:hover {
            transform: translate(-50%, -50%) rotate(var(--rotation, 0deg)) scale(1.15);

        function showArrows() {
            hotspots.innerHTML = "";

            const currentNavigation = navigation[currentPhoto] || [];

            currentNavigation.forEach(function(point) {
                const button = document.createElement("button");

                button.className = "hotspot";
                button.innerText = point.arrow;
                button.style.left = point.x + "%";
                button.style.top = point.y + "%";

                button.style.setProperty(
                    "--rotation",
                    (point.rotation || 0) + "deg"
                );

                button.title = `Go to photo ${point.target}`;

                button.onclick = function() {
                    moveTo(point.target);
                };

                hotspots.appendChild(button);
            });

            const position = photos.findIndex(
                item => item.id === currentPhoto
            );

            status.innerText =
                `Photo ${currentPhoto} · ${position + 1} of ${photos.length}`;
        }

        function moveTo(target) {
            if (moving || target === currentPhoto) {
                return;
            }

            const destination = photos.find(
                item => item.id === target
            );

            if (!destination) {
                error.innerText = `Photo ${target} does not exist.`;
                return;
            }

            moving = true;
            error.innerText = "";

            photo.classList.add("moving");

            setTimeout(function() {
                photo.onload = function() {
                    currentPhoto = target;
                    photo.classList.remove("moving");
                    showArrows();
                    moving = false;
                };

                photo.onerror = function() {
                    photo.classList.remove("moving");

                    error.innerText =
                        `Could not load ${destination.src}. Check the filename.`;

                    moving = false;
                };

                photo.src = destination.src;
            }, 350);
        }

        photo.onload = function() {
            showArrows();
        };

        photo.onerror = function() {
            status.innerText = "Photo could not be loaded.";
            error.innerText = "Check that floor3/0.jpeg exists.";
        };

        photo.src = photos[0].src;
